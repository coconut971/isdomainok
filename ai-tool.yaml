name: okitsok
version: 1.0.0
type: cli

description: >
  okitsok is a local CLI tool that checks domain name availability
  using DNS signals only. It is fast, offline-friendly, and does not
  rely on registrars or external APIs.

philosophy:
  - local-first
  - dns-based
  - no-certification
  - no-external-service

install:
  windows:
    method: download
    url: https://github.com/coconut971/okitsok/releases/latest/download/okitsok.exe
  macos:
    method: download
    url: https://github.com/coconut971/okitsok/releases/latest/download/okitsok
  linux:
    method: download
    url: https://github.com/coconut971/okitsok/releases/latest/download/okitsok

usage:
  command: okitsok {domain} --json
  input:
    domain:
      type: string
      description: Base domain name without TLD
  output:
    format: json
    schema:
      patternProperties:
        ".*":
          type: string
          enum: [available, taken, unknown]

exit_codes:
  0: At least one domain is available
  1: No domain is available
  130: Interrupted by user

trust:
  source: github
  repository: https://github.com/coconut971/okitsok
  license: MIT
