[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isdomainok"
version = "2.0.0"
description = "Fast domain intelligence CLI: RDAP, DNS, public sale signals and optional registrar pricing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "coconut971"}]
keywords = ["domain", "dns", "rdap", "cli", "domain-name", "availability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: Utilities",
]
dependencies = ["dnspython>=2.6"]

[project.scripts]
isdomainok = "okitsok.cli:main"
okitsok = "okitsok.cli:main"

[project.urls]
Homepage = "https://github.com/coconut971/okitsok"
Repository = "https://github.com/coconut971/okitsok"
Issues = "https://github.com/coconut971/okitsok/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["okitsok*"]
